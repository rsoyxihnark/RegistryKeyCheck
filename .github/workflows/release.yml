name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit subjects, version and changelog
        id: gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null 2>&1 || true
          fail() { echo "::error::$1"; exit 1; }
          vkey() { printf '%s\n' "$1" | awk -F. '{printf "%09d%09d%09d\n", $1, $2, $3}'; }
          srcver() { git show "$1:RegistryKey Check.csproj" 2>/dev/null | tr -d '\r' | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -1 || true; }
          head=$(git rev-parse HEAD)
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$head"; then
            commits=$(git rev-list --reverse "$BEFORE..$head")
          else
            commits=$head
          fi
          publish=false
          version=""
          for c in $commits; do
            subject=$(git log -1 --format=%s "$c" | tr -d '\r')
            case "$subject" in
              "[no release]"*)
                if git rev-parse -q --verify "$c^" >/dev/null; then
                  [ "$(srcver "$c")" = "$(srcver "$c^")" ] || fail "Commit $c is [no release] but changes the version in RegistryKey Check.csproj from $(srcver "$c^") to $(srcver "$c")"
                fi
                changed=$(git diff-tree --no-commit-id --name-only -r --root "$c")
                program=$(printf '%s\n' "$changed" | grep -Ev '^(\.github/|\.claude/|CLAUDE\.md$|README\.md$|COMPARISON\.md$|\.gitignore$|CHANGELOG\.md$|$)' || true)
                if [ -n "$program" ]; then
                  printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md' || fail "Commit $c is [no release] and changes the program but leaves CHANGELOG.md untouched"
                fi
                continue ;;
              "["[0-9]*"]"*) ;;
              *) fail "Commit $c must start with [x.y.z] or [no release]: $subject" ;;
            esac
            ver=$(printf '%s\n' "$subject" | sed -n 's/^\[\([0-9][0-9.]*\)\].*/\1/p')
            printf '%s\n' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || fail "Commit $c carries a version that is not major.minor.patch: $subject"
            src=$(srcver "$c")
            [ "$src" = "$ver" ] || fail "Commit $c says $ver but RegistryKey Check.csproj says $src"
            git diff-tree --no-commit-id --name-only -r --root "$c" | grep -qx 'CHANGELOG.md' || fail "Commit $c ships $ver but leaves CHANGELOG.md untouched"
            log=$(git show "$c:CHANGELOG.md" | tr -d '\r' | sed 's/[[:space:]]*$//')
            if printf '%s\n' "$log" | grep -Eiq '^## +unreleased'; then fail "CHANGELOG.md still has an Unreleased heading at $c"; fi
            top=$(printf '%s\n' "$log" | sed -n 's/^## \(.*\)$/\1/p' | head -1)
            [ "$top" = "$ver" ] || fail "The top section of CHANGELOG.md is $top, not $ver"
            entries=$(printf '%s\n' "$log" | awk -v h="## $ver" '$0==h{f=1;next} /^## /{if(f)exit} f && /^- /')
            [ -n "$entries" ] || fail "CHANGELOG.md has no entries under $ver"
            body=$(git log -1 --format=%b "$c" | tr -d '\r' | sed 's/[[:space:]]*$//' | grep '^- ' || true)
            [ "$entries" = "$body" ] || fail "The commit body of $c does not match the $ver section of CHANGELOG.md"
            if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
              [ "$(git rev-list -n 1 "v$ver")" = "$c" ] || fail "Version $ver has already been released from another commit"
              continue
            fi
            for t in $(git tag -l 'v[0-9]*' | sed 's/^v//'); do
              [[ "$(vkey "$ver")" > "$(vkey "$t")" ]] || fail "Version $ver is not higher than the released version $t"
            done
            [ "$c" = "$head" ] || fail "Commit $c ships $ver but is not the last commit of the push; push version commits one at a time"
            publish=true
            version=$ver
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish version=$version"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish "RegistryKey Check.csproj" -c Release -o out
          mkdir -p dist
          cp "out/RegistryKey Check.exe" dist/RegistryKeyCheck.exe

      - name: Test against the registry
        shell: bash
        run: dotnet run --project .github/tests/RegistryTests -c Release -- "bin/Release/net10.0-windows/win-x64/RegistryKey Check.dll"

      - name: Start the exe
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item 'dist\RegistryKeyCheck.exe' $dir
          $p = Start-Process -FilePath (Join-Path $dir 'RegistryKeyCheck.exe') -WorkingDirectory $dir -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline -and -not (Test-Path (Join-Path $dir 'List.txt'))) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force }
          $loaded = Test-Path (Join-Path $dir 'List.txt')
          $logMade = Test-Path (Join-Path $dir 'Log.txt')
          if (-not ($running -and $loaded)) { Write-Error "RegistryKey Check did not open its main window (running=$running, loaded=$loaded)"; exit 1 }
          if ($logMade) { Write-Error 'RegistryKey Check made a Log.txt although nothing went wrong'; exit 1 }
          Write-Host 'RegistryKey Check started and opened its main window'

      - name: Open with List.txt beside the exe
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, PresentationCore, PresentationFramework, WindowsBase, System.Windows.Forms
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @'
          using System;
          using System.Drawing;
          using System.Drawing.Imaging;
          using System.Runtime.InteropServices;
          public static class WindowShot
          {
              [StructLayout(LayoutKind.Sequential)]
              private struct Rect { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              private static extern bool GetWindowRect(IntPtr hwnd, out Rect rect);
              [DllImport("user32.dll")]
              private static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hwnd);
              public static void Save(IntPtr hwnd, string path)
              {
                  Rect r;
                  GetWindowRect(hwnd, out r);
                  using (Bitmap bitmap = new Bitmap(r.Right - r.Left, r.Bottom - r.Top))
                  {
                      using (Graphics graphics = Graphics.FromImage(bitmap))
                      {
                          IntPtr hdc = graphics.GetHdc();
                          PrintWindow(hwnd, hdc, 2);
                          graphics.ReleaseHdc(hdc);
                      }
                      bitmap.Save(path, ImageFormat.Png);
                  }
              }
          }
          '@
          $dir = Join-Path $env:RUNNER_TEMP 'smokelist'
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          $key = 'HKCU:\Software\RegistryKeyCheckSmoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          New-Item -ItemType Directory -Path $shots -Force | Out-Null
          Copy-Item 'dist\RegistryKeyCheck.exe' $dir
          New-Item -ItemType File -Path (Join-Path $dir 'Log.txt') -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $dir 'Ignore.txt') -Force | Out-Null
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'Here' -Value '1' -PropertyType String -Force | Out-Null
          Set-Content -Path (Join-Path $dir 'List.txt') -Value @(
            'reg add "HKCU\Software\RegistryKeyCheckSmoke" /v "Here" /t REG_SZ /d "1" /f',
            'reg add "HKCU\Software\RegistryKeyCheckSmoke" /v "Here" /t REG_SZ /d "1" /f',
            'reg add "HKCU\Software\RegistryKeyCheckSmoke" /v "Missing" /t REG_SZ /d "1" /f',
            'reg delete "HKCU\Software\RegistryKeyCheckSmoke\Gone" /f'
          )
          $auto = [System.Windows.Automation.AutomationElement]
          $scope = [System.Windows.Automation.TreeScope]
          $types = [System.Windows.Automation.ControlType]
          function Find-Id([string]$id) { $window.FindFirst($scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($auto::AutomationIdProperty, $id))) }
          function Read-Count([string]$word) {
            $texts = @($window.FindAll($scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($auto::ControlTypeProperty, $types::Text))) | ForEach-Object { $_.Current.Name })
            @($texts | Where-Object { $_ -match "^\d+ $word$" })[0]
          }
          function Count-Rows { @($grid.FindAll($scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($auto::ControlTypeProperty, $types::DataItem)))).Count }
          function Wait-Until([scriptblock]$ok) {
            $end = (Get-Date).AddSeconds(20)
            while (-not (& $ok) -and (Get-Date) -lt $end) { Start-Sleep -Milliseconds 500 }
            & $ok
          }
          function Read-Toggle([string]$id) { (Find-Id $id).GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Current.ToggleState.ToString() }
          function Flip([string]$id) { (Find-Id $id).GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle() }
          function Find-Focused { (Find-Id 'TextBoxFind').Current.HasKeyboardFocus }
          function Read-FirstUid { $grid.GetCurrentPattern([System.Windows.Automation.GridPattern]::Pattern).GetItem(0, 0).GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value }
          function Save-Shot([string]$name) { [WindowShot]::Save([IntPtr]$window.Current.NativeWindowHandle, (Join-Path $shots "$name.png")) }
          $p = Start-Process -FilePath (Join-Path $dir 'RegistryKeyCheck.exe') -WorkingDirectory $dir -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $window = $null
          $grid = $null
          $rows = -1
          $counts = ''
          while (-not $p.HasExited -and (Get-Date) -lt $deadline -and -not ($rows -eq 1 -and $counts -eq '4 lines, 3 compliant, 1 noncompliant')) {
            Start-Sleep -Seconds 1
            if ($null -eq $window) {
              $window = $auto::RootElement.FindFirst($scope::Children, (New-Object System.Windows.Automation.PropertyCondition($auto::ProcessIdProperty, [int]$p.Id)))
            }
            if ($null -ne $window -and $null -eq $grid) {
              $grid = Find-Id 'DataGridRegCommands'
            }
            if ($null -ne $grid) {
              $rows = Count-Rows
              $counts = (Read-Count 'lines') + ', ' + (Read-Count 'compliant') + ', ' + (Read-Count 'noncompliant')
            }
          }
          $expected = @('UID', 'Path', 'Value', 'Expected', 'Actual', 'Details')
          $seen = @{}
          if ($null -ne $grid) {
            foreach ($header in $grid.FindAll($scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($auto::ControlTypeProperty, $types::HeaderItem)))) {
              if (-not $header.Current.IsOffscreen -and $header.Current.Name -and -not $seen.ContainsKey($header.Current.Name)) {
                $seen[$header.Current.Name] = $header.Current.BoundingRectangle.Width
              }
            }
          }
          $absent = @($expected | Where-Object { -not $seen.ContainsKey($_) })
          $extra = @($seen.Keys | Where-Object { $expected -notcontains $_ })
          $cut = @()
          if ($seen.ContainsKey('UID')) {
            $scale = $seen['UID'] / 40
            $typeface = New-Object System.Windows.Media.Typeface([System.Windows.SystemFonts]::MessageFontFamily, [System.Windows.FontStyles]::Normal, [System.Windows.FontWeights]::Normal, [System.Windows.FontStretches]::Normal)
            foreach ($name in @($expected | Where-Object { $seen.ContainsKey($_) })) {
              $text = New-Object System.Windows.Media.FormattedText($name, [System.Globalization.CultureInfo]::InvariantCulture, [System.Windows.FlowDirection]::LeftToRight, $typeface, [System.Windows.SystemFonts]::MessageFontSize, [System.Windows.Media.Brushes]::Black)
              if ($seen[$name] / $scale -lt $text.Width + 12) { $cut += $name }
            }
          }
          $started = -not $p.HasExited -and $rows -eq 1 -and $counts -eq '4 lines, 3 compliant, 1 noncompliant'
          $focused = $false
          $lit = ''
          $both = $false
          $compliantOnly = $false
          $reset = $false
          $unlit = ''
          $ctrlF = $false
          $found = $false
          $cleared = $false
          $sortedDown = $false
          $sortKept = $false
          if ($started) {
            try {
              [WindowShot]::SetForegroundWindow([IntPtr]$window.Current.NativeWindowHandle) | Out-Null
              $focused = Wait-Until { Find-Focused }
              $lit = (Read-Toggle 'ButtonFilterFalses') + '/' + (Read-Toggle 'ButtonFilterTrues')
              Save-Shot 'start'
              Flip 'ButtonFilterTrues'
              $both = Wait-Until { (Count-Rows) -eq 4 -and (Read-Toggle 'ButtonFilterFalses') -eq 'On' -and (Read-Toggle 'ButtonFilterTrues') -eq 'On' }
              Save-Shot 'both'
              Flip 'ButtonFilterFalses'
              $compliantOnly = Wait-Until { (Count-Rows) -eq 3 -and (Read-Toggle 'ButtonFilterFalses') -eq 'Off' -and (Read-Toggle 'ButtonFilterTrues') -eq 'On' }
              (Find-Id 'ButtonAllFiltersReset').GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $reset = Wait-Until { (Count-Rows) -eq 4 }
              $unlit = (Read-Toggle 'ButtonFilterFalses') + '/' + (Read-Toggle 'ButtonFilterTrues')
              Save-Shot 'all'
              $grid.SetFocus()
              Wait-Until { -not (Find-Focused) } | Out-Null
              [System.Windows.Forms.SendKeys]::SendWait('^f')
              $ctrlF = Wait-Until { Find-Focused }
              (Find-Id 'TextBoxFind').GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue('Missing')
              $found = Wait-Until { (Count-Rows) -eq 1 }
              Save-Shot 'find'
              [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
              $cleared = Wait-Until { (Count-Rows) -eq 4 -and (Find-Id 'TextBoxFind').GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value -eq '' }
              $uid = @($grid.FindAll($scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($auto::ControlTypeProperty, $types::HeaderItem))) | Where-Object { $_.Current.Name -eq 'UID' })[0]
              $uid.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $uid.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $sortedDown = Wait-Until { (Count-Rows) -eq 4 -and (Read-FirstUid) -eq '4' }
              (Find-Id 'TextBoxFind').GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue('Here')
              $sortKept = Wait-Until { (Count-Rows) -eq 2 -and (Read-FirstUid) -eq '2' }
              Save-Shot 'sorted'
            }
            catch {
              Write-Host "Driving the window failed: $_"
            }
          }
          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force }
          $written = $null -ne (Get-ItemProperty -Path $key -Name 'Missing' -ErrorAction SilentlyContinue)
          $emptyKept = @('Log.txt', 'Ignore.txt' | Where-Object { Test-Path (Join-Path $dir $_) })
          Remove-Item -Path $key -Recurse -Force
          Write-Host "running=$running, rows=$rows, $counts, headers: $(($seen.Keys | Sort-Object) -join ', '), focused=$focused, lit=$lit, both=$both, compliantOnly=$compliantOnly, reset=$reset, unlit=$unlit, ctrlF=$ctrlF, found=$found, cleared=$cleared, sortedDown=$sortedDown, sortKept=$sortKept"
          if (-not $started) { Write-Error 'RegistryKey Check did not read List.txt, run Query Registry, show only the False row and count 4 lines, 3 compliant and 1 noncompliant at start'; exit 1 }
          if ($absent.Count -gt 0 -or $cut.Count -gt 0) { Write-Error "Headers missing: $($absent -join ', '). Headers cut off: $($cut -join ', ')"; exit 1 }
          if ($extra.Count -gt 0) { Write-Error "Columns shown at start that should be hidden: $($extra -join ', ')"; exit 1 }
          if (-not $focused) { Write-Error 'The Find box did not have the keyboard focus at start'; exit 1 }
          if ($lit -ne 'On/Off') { Write-Error "Non-Compliant was not the only lit filter button at start: $lit"; exit 1 }
          if (-not $both) { Write-Error 'Compliant and Non-Compliant on together did not show the rows of both'; exit 1 }
          if (-not $compliantOnly) { Write-Error 'Compliant alone did not show only the compliant rows'; exit 1 }
          if (-not $reset) { Write-Error 'All Filters Reset did not show every row'; exit 1 }
          if ($unlit -ne 'Off/Off') { Write-Error "All Filters Reset left a filter button lit: $unlit"; exit 1 }
          if (-not $ctrlF) { Write-Error 'Ctrl+F did not put the keyboard focus in the Find box'; exit 1 }
          if (-not $found) { Write-Error 'The Find box did not show only the rows with that text'; exit 1 }
          if (-not $cleared) { Write-Error 'Esc did not clear the Find box, keep it open and show every row again'; exit 1 }
          if (-not $sortedDown) { Write-Error 'Clicking the UID header twice did not sort the rows from the last line up'; exit 1 }
          if (-not $sortKept) { Write-Error 'Typing in the Find box lost the sort order of the rows'; exit 1 }
          if (-not $running) { Write-Error 'RegistryKey Check closed by itself'; exit 1 }
          if ($written) { Write-Error 'Opening RegistryKey Check wrote a value from List.txt into the registry'; exit 1 }
          if ($emptyKept.Count -gt 0) { Write-Error "RegistryKey Check kept or made an empty file although nothing went wrong: $($emptyKept -join ', ')"; exit 1 }
          Write-Host 'RegistryKey Check read List.txt, counted the lines, showed only the False row with every header in full, let both filters be on together, the Find box found the row with that text and kept the sort order'

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: Publish release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          git log -1 --format=%b HEAD | tr -d '\r' > notes.md
          gh release create "v$VERSION" dist/RegistryKeyCheck.exe --title "RegistryKey Check $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx 'RegistryKeyCheck.exe' || { echo "::error::RegistryKeyCheck.exe is not attached to v$VERSION"; exit 1; }
